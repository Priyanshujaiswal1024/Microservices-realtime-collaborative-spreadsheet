# Template for services to connect to Eureka Server
# Copy this to src/main/resources/bootstrap.yml in each service

spring:
  application:
    name: <service-name>  # e.g., user-service, sheet-service
  
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 10
    instance-info-replication-interval-seconds: 10
  
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

---
# Production profile - use environment variables
spring:
  config:
    activate:
      on-profile: prod

spring.cloud.config:
  uri: ${CONFIG_SERVER_URL:http://config-server:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:${spring.application.name}}
