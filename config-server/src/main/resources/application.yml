server:
  port: 8888

spring:
  application:
    name: config-server
  
  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: file:./config-server/src/main/resources/config/,classpath:/config/

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.springframework.boot: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
