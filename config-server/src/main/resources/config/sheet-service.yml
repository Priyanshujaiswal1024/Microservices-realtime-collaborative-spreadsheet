server:
  port: 8082

spring:
  application:
    name: sheet-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/sheetdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2401301024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
  
  # Redis for caching
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes

spring.data.redis:
  database: 1

# Import/Export configuration
import-export:
  max-file-size: 10485760  # 10MB in bytes
  allowed-formats: csv,xlsx
  temp-directory: ${java.io.tmpdir}/collab-spreadsheet

# Kafka producer configuration
spring.kafka:
  producer:
    properties:
      max.block.ms: 5000
