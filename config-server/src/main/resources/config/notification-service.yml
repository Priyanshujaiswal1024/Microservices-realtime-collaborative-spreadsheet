server:
  port: 8085

spring:
  application:
    name: notification-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notificationdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2401301024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
  
  # Email configuration (Google Gmail SMTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:2401301024@geetauniversity.edu.in}
    password: ${MAIL_PASSWORD:wnaszsqvfynfxhyw}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: true

# Kafka consumer configuration
spring.kafka:
  consumer:
    group-id: notification-service-group
    properties:
      isolation.level: read_committed

# Redis for deduplication
spring.data.redis:
  database: 4

# Notification configuration
notifications:
  email:
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:true}
    from: ${NOTIFICATIONS_EMAIL_FROM:2401301024@geetauniversity.edu.in}
  in-app:
    enabled: true
    retention-days: 30

# Deduplication
deduplication:
  ttl-seconds: 3600  # 1 hour
