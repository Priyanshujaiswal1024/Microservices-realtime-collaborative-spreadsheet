server:
  port: 8084

spring:
  application:
    name: comment-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/commentdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2401301024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
  
  # WebSocket for real-time comment delivery
  websocket:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

spring.data.redis:
  database: 3

# @mention configuration
mentions:
  pattern: "@([a-zA-Z0-9_-]+)"
  max-mentions-per-comment: 10

# JWT for authentication
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-change-this-in-production-please-use-env-variable}
