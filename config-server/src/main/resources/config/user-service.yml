server:
  port: 8091

spring:
  application:
    name: user-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/userdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2401301024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

# JWT configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-change-this-in-production-please-use-env-variable}
  access-token-validity: 900000      # 15 minutes in milliseconds
  refresh-token-validity: 604800000  # 7 days in milliseconds

# Redis for refresh tokens
spring.data.redis:
  database: 0
