server:
  port: 8083

spring:
  application:
    name: collab-service
  
  # WebSocket configuration
  websocket:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    message-size-limit: 65536  # 64KB

spring.data.redis:
  database: 2

# CRDT configuration
crdt:
  # Redis key prefixes
  cell-state-prefix: "sheet:{sheetId}:cells"
  pubsub-channel-prefix: "sheet:{sheetId}:broadcast"
  stream-prefix: "sheet:{sheetId}:ops"
  
  # Stream configuration
  stream-max-length: 1000
  stream-retention-ms: 3600000  # 1 hour
  
  # Client ID generation
  client-id-prefix: "collab-"

# Presence tracking
presence:
  heartbeat-interval-ms: 5000
  timeout-ms: 15000
  cleanup-interval-ms: 30000

# Kafka producer for async persistence
spring.kafka:
  producer:
    properties:
      max.block.ms: 5000

# JWT for WebSocket authentication
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-change-this-in-production-please-use-env-variable}

# Resilience4j - bulkhead for WebSocket connections
resilience4j:
  bulkhead:
    configs:
      websocket:
        max-concurrent-calls: 1000
        max-wait-duration: 0
