apiVersion: apps/v1
kind: Deployment
metadata:
  name: sheet-service
  namespace: collab-spreadsheet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sheet-service
  template:
    metadata:
      labels:
        app: sheet-service
    spec:
      containers:
        - name: sheet-service
          image: collab-spreadsheet/sheet-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1024Mi"
              cpu: "1500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 35
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sheet-service
  namespace: collab-spreadsheet
spec:
  selector:
    app: sheet-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sheet-service-hpa
  namespace: collab-spreadsheet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sheet-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
