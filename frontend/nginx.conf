# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name sheetforge-app.duckdns.org 104.208.85.216 localhost;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # API and WS reverse proxy on port 80 as fallback
    location /ws {
        proxy_pass http://api-gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api-gateway:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name sheetforge-app.duckdns.org 104.208.85.216;

    ssl_certificate /etc/letsencrypt/live/sheetforge-app.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sheetforge-app.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy WebSocket to Gateway
    location /ws {
        proxy_pass http://api-gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Reverse proxy API calls to Gateway
    location /api/ {
        proxy_pass http://api-gateway:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
